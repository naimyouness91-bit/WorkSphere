input {
  file {
    path => "/var/log/worksphere/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
  }
}

filter {
  if [message] {
    mutate {
      add_field => { "app" => "worksphere" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "worksphere-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
