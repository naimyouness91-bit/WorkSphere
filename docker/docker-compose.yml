services:
  mysql:
    image: mysql:8.0
    container_name: worksphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-worksphere}
      MYSQL_USER: ${MYSQL_USER:-worksphere}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - worksphere
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: worksphere-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - worksphere
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: worksphere-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: WorkSphere
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_LOCALE: ${APP_LOCALE:-en}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-worksphere}
      DB_USERNAME: ${MYSQL_USER:-worksphere}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_GUARD: ${AUTH_GUARD:-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET:-}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    volumes:
      - ../backend:/var/www/html
      - backend_storage:/var/www/html/storage
    networks:
      - worksphere

  nginx:
    image: nginx:alpine
    container_name: worksphere-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - worksphere

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-en}
    container_name: worksphere-frontend
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - worksphere

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: worksphere-prometheus
    profiles: [monitoring]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - worksphere

  grafana:
    image: grafana/grafana:11.2.0
    container_name: worksphere-grafana
    profiles: [monitoring]
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - worksphere

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: worksphere-elasticsearch
    profiles: [monitoring]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - worksphere

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: worksphere-logstash
    profiles: [monitoring]
    depends_on:
      - elasticsearch
    volumes:
      - ./logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ../backend/storage/logs:/var/log/worksphere:ro
    networks:
      - worksphere

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: worksphere-kibana
    profiles: [monitoring]
    depends_on:
      - elasticsearch
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - worksphere

volumes:
  mysql_data:
  backend_storage:
  redis_data:
  elastic_data:

networks:
  worksphere:
    driver: bridge
